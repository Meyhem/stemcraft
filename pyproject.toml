[project]
name = "stemcraft"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "stemcraft-lib",
    "stemcraft-worker",
    "stemcraft-api",
]

[tool.uv.workspace]
members = ["packages/*"]

# C-01: single machine, and that machine is Linux. Scoping resolution to it
# avoids solving for platforms this project will never run on -- notably,
# demucs's own metadata pins numpy<2 under a darwin/x86_64 marker, which
# conflicts with numpy>=2 (stemcraft-worker's pyproject.toml) the moment uv
# tries to also satisfy that irrelevant platform.
[tool.uv]
environments = ["sys_platform == 'linux'"]

# D-02: torch is pinned to the cu128 index, not to a version range -- the
# index is what a transitive dependency could otherwise bypass by resolving
# torch from plain PyPI (a CPU wheel), which a version range alone can't stop.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
stemcraft-lib = { workspace = true }
stemcraft-worker = { workspace = true }
stemcraft-api = { workspace = true }
torch = [{ index = "pytorch-cu128" }]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
