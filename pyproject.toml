[project]
name = "stemcraft"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "stemcraft-lib",
    "stemcraft-worker",
    "stemcraft-api",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
stemcraft-lib = { workspace = true }
stemcraft-worker = { workspace = true }
stemcraft-api = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
