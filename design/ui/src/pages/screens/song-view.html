<!-- @dsCard group="Screens" name="Song screen — Stems" subtitle="One header, one pinned transport, a zoomable time axis" viewport="1440x1000" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Song screen — Stems — Stemcraft</title><style>/* @inject */

.body2{display:flex;flex-direction:column;flex:1;min-height:0}
.stage{display:flex;flex-direction:column;min-width:0;flex:1}
.rail{background:var(--ds-surface);overflow:auto;padding:var(--ds-4);display:flex;flex-direction:column;gap:var(--ds-5)}
.lanes{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.stem-row{flex:1}.stem-lane{height:auto}
.axis{position:relative;display:flex;flex-direction:column;flex:1;min-height:420px;margin:0 var(--ds-4) var(--ds-4);border:1px solid var(--ds-border);border-radius:var(--ds-r-panel);overflow:hidden}
.axrow{display:grid;grid-template-columns:200px 1fr;flex:none}
.axhead{display:flex;align-items:center;justify-content:flex-end;padding-right:var(--ds-4);background:var(--ds-surface);border-bottom:1px solid var(--ds-border);border-right:1px solid var(--ds-border)}
.chords{display:flex;height:44px;background:var(--ds-surface);position:relative;border-bottom:1px solid var(--ds-border)}
.chords .c{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding-left:var(--ds-2);border-left:1px solid var(--ds-border);font:600 var(--ds-t-md)/1 var(--ds-font)}
.chords .c.now{background:rgba(79,163,255,.12);color:var(--ds-text)}
.axis .grid-bars{background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 1px,transparent 1px 140px)}
.axis .grid-beats{background:repeating-linear-gradient(90deg,rgba(255,255,255,.055) 0 1px,transparent 1px 35px)}
.hscroll{height:10px;position:relative;border-top:1px solid var(--ds-border);background:var(--ds-ground)}
.hscroll i{position:absolute;top:2px;height:6px;border-radius:3px;background:var(--ds-border-strong)}
.keyrow{display:flex;flex-direction:column;gap:var(--ds-2)}
.fb{background:var(--ds-ground);border:1px solid var(--ds-border);border-radius:var(--ds-r-panel);padding:var(--ds-4) var(--ds-3) var(--ds-3)}
.fb svg{width:100%;height:auto;display:block}
.fb text{font-family:var(--ds-font)}
.fb .fnum{font:500 13px var(--ds-mono);fill:var(--ds-text-3)}
.fb .sname{font-weight:600;font-size:17px;fill:var(--ds-text-3)}
.fb .dotn{font-weight:700;font-size:15px;fill:var(--ds-ground)}
.fb .doto{font-weight:700;font-size:10px;fill:var(--ds-ground)}
.fb .lanel{font-weight:600;font-size:13px;fill:var(--ds-text)}
.fb .chipn{font-weight:700;font-size:15px;fill:var(--ds-ground)}
.fb .dim{fill:var(--ds-text-3)}
.ribbon{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.rb{min-height:var(--ds-hit-setup);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--ds-raised);border:1px solid var(--ds-border);border-radius:var(--ds-r-input);color:var(--ds-text-2);font:600 var(--ds-t-sm)/1 var(--ds-font);cursor:pointer}
.rb .num{font:500 11px var(--ds-mono);color:var(--ds-text-3)}
.rb.inloop{background:rgba(79,195,176,.12)}
.rb.now{border-color:var(--ds-bass);color:var(--ds-bass)}
.legend{display:flex;gap:var(--ds-5);flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:-4px;margin-right:var(--ds-2)}

/* ---- new in this design ---- */
.stage > .tpanel{margin:var(--ds-4) var(--ds-4) 0}
.viewbar{display:flex;align-items:flex-end;gap:var(--ds-5);margin:var(--ds-4);min-height:56px}
.viewseg > button{min-height:48px;padding:0 var(--ds-6);font-size:var(--ds-t-md)}
.tabs-body{margin:0 var(--ds-4) var(--ds-4);display:flex;flex-direction:column;gap:var(--ds-4)}
.pattern{display:flex;flex-wrap:wrap;gap:var(--ds-4) var(--ds-5);align-items:flex-end}
.titlebtn{display:flex;align-items:center;gap:var(--ds-3);background:transparent;border:1px solid transparent;border-radius:var(--ds-r-btn);padding:var(--ds-1) var(--ds-3);margin-left:calc(-1 * var(--ds-3));color:inherit;cursor:text;text-align:left;font:inherit}
.titlebtn:hover,.titlebtn:focus-visible{border-color:var(--ds-border-strong);background:var(--ds-raised)}
.titlebtn svg{width:16px;height:16px;fill:var(--ds-text-3);flex:none}
.titlebtn:hover svg{fill:var(--ds-text)}

</style></head><body><div class="app">

<div class="topbar">
  <button class="iconbtn" aria-label="Back to library"><svg viewBox="0 0 24 24"><path d="M15.4 7.4L14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg></button>

  <!-- Rename: the title block is the control. Click it, edit title and artist in place. -->
  <button class="titlebtn" title="Rename">
    <span class="col" style="gap:0;min-width:0">
      <span class="t-md" style="font-weight:600;white-space:nowrap">Tightrope</span>
      <span class="t-sm dim" style="white-space:nowrap">Walk the Moon</span>
    </span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.7 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
  </button>

  <div class="grow"></div>
  <button class="btn btn-primary">Export</button>
</div>

<div class="body2">
  <div class="stage">

    <!-- ONE transport, identical in both views, pinned while the content scrolls -->
    <div class="tpanel">
      <div class="trow">
        <button class="iconbtn iconbtn-perform iconbtn-play" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg></button>
        <div class="readout"><span class="cap">bar</span><span class="big">17</span></div>
        <div class="readout"><span class="cap">chord</span><span class="chord">Gm <span class="dim3">&rarr; Dm</span></span></div>
        <div class="grow"></div>
        <div class="readout"><span class="cap">tempo</span><div class="stepper stepper-perform"><button aria-label="Tempo down">&minus;</button><output>120%</output><button aria-label="Tempo up">+</button></div></div>
        <div class="readout"><span class="cap">pitch</span><div class="stepper stepper-perform"><button aria-label="Pitch down">&minus;</button><output>&minus;2 st</output><button aria-label="Pitch up">+</button></div></div>
        <div class="splitbtn">
          <button class="btn btn-perform" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>Loop <span class="num">17&ndash;18</span></button>
          <button class="btn btn-perform" aria-pressed="true" aria-label="Edit loop" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg></button>
        </div>
        <button class="btn btn-perform" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>Practice</button>
      </div>
    </div>

    <!-- View switch + the setup controls that belong to the chosen view -->
    <div class="viewbar">
      <div class="seg viewseg" role="tablist" aria-label="View">
        <button role="tab" aria-selected="true">Stems</button>
        <button role="tab" aria-selected="false">Tabs</button>
      </div>
      <div class="grow"></div>
      <div class="row" style="gap:var(--ds-4);align-items:flex-end">
        <div class="col" style="gap:var(--ds-1)">
          <span class="cap">zoom</span>
          <div class="zoomctl"><button class="btn" aria-label="Zoom out">&minus;</button><output class="zoomval">7.4 bars in view</output><button class="btn" aria-label="Zoom in">+</button><button class="btn">Fit</button></div>
        </div>
        <button class="btn btn-primary" aria-pressed="true">Follow playhead</button>
      </div>
    </div>

    <!-- ===== Stems content ===== -->
    <div style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="axis">
      <div class="axrow"><div class="axhead cap" style="height:26px">bar</div>
        <div class="ruler">
          <span style="left:0">13</span><span style="left:140px">14</span><span style="left:280px">15</span><span style="left:420px">16</span>
          <span style="left:560px">17</span><span style="left:700px">18</span><span style="left:840px">19</span>
        </div>
      </div>
      <div class="axrow"><div class="axhead cap">chords</div>
        <div class="chords">
          <div class="c" style="left:0;width:140px;color:var(--ds-text-2)">F</div>
          <div class="c" style="left:140px;width:140px;color:var(--ds-text-2)">Gm</div>
          <div class="c" style="left:280px;width:140px;color:var(--ds-text-2)">B&#9837;</div>
          <div class="c" style="left:420px;width:140px;color:var(--ds-text-2)">E&#9837;</div>
          <div class="c now" style="left:560px;width:140px">Gm</div>
          <div class="c" style="left:700px;width:140px;color:var(--ds-text-2)">Dm</div>
          <div class="c" style="left:840px;width:140px;color:var(--ds-text-2)">E&#9837;</div>
        </div>
      </div>

      <div class="lanes">
        <div class="stem-row stem stem-v">
          <div class="stem-ctl">
            <div class="stem-name"><i class="sw"></i>vocals</div>
            <div class="ms"><button data-k="m">M</button><button data-k="s">S</button></div>
            <div class="row" style="gap:var(--ds-2)"><div class="gainbar grow"><i style="width:80%"></i></div><span class="num t-xs dim">0.0 dB</span></div>
          </div>
          <div class="stem-lane"><!--@wave vocals 1200 120 11--></div>
        </div>
        <div class="stem-row stem stem-d">
          <div class="stem-ctl">
            <div class="stem-name"><i class="sw"></i>drums</div>
            <div class="ms"><button data-k="m">M</button><button data-k="s">S</button></div>
            <div class="row" style="gap:var(--ds-2)"><div class="gainbar grow"><i style="width:80%"></i></div><span class="num t-xs dim">0.0 dB</span></div>
          </div>
          <div class="stem-lane"><!--@wave drums 1200 120 22--></div>
        </div>
        <div class="stem-row stem stem-b">
          <div class="stem-ctl">
            <div class="stem-name"><i class="sw"></i>bass</div>
            <div class="ms"><button data-k="m" aria-pressed="true">M</button><button data-k="s">S</button></div>
            <div class="row" style="gap:var(--ds-2)"><div class="gainbar grow"><i style="width:80%"></i></div><span class="num t-xs dim">0.0 dB</span></div>
          </div>
          <div class="stem-lane muted"><!--@wave bass 1200 120 33--></div>
        </div>
        <div class="stem-row stem stem-o">
          <div class="stem-ctl">
            <div class="stem-name"><i class="sw"></i>other</div>
            <div class="ms"><button data-k="m">M</button><button data-k="s">S</button></div>
            <div class="row" style="gap:var(--ds-2)"><div class="gainbar grow"><i style="width:80%"></i></div><span class="num t-xs dim">&minus;3.5 dB</span></div>
          </div>
          <div class="stem-lane"><!--@wave other 1200 120 44--></div>
        </div>
      </div>

      <div class="grid-beats" style="left:200px;top:0"></div>
      <div class="grid-bars" style="left:200px;top:0"></div>
      <div class="loopregion" data-a="17" data-b="19" style="left:760px;width:280px"></div>
      <div class="playhead" style="left:838px"></div>
      <div class="hscroll"><i style="left:38%;width:22%"></i></div>
    </div>
    </div>

  </div>

</div>
</div>
</body></html>
