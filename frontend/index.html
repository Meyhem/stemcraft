<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Stemcraft</title>
    <!-- U-15: the splash. Shown while the bundle downloads, so it is plain HTML and CSS
         with the token values written out (tokens.css has not loaded yet; a test holds
         them to it). React replaces #root's children on first render, which removes it. -->
    <style>
      html { background: #0B0C0E; }
      #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
        color: #9BA3AE; font: 24px/30px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial, sans-serif; }
      #splash .bar { position: relative; width: 560px; max-width: 80vw; height: 10px; overflow: hidden; isolation: isolate; }
      #splash .bar i { position: absolute; inset: 0; mix-blend-mode: screen; }
      #splash .bar i::before, #splash .bar i::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 50%;
        background: linear-gradient(90deg, transparent, var(--c), transparent); animation: splash-drift 3.1s ease-in-out infinite alternate; }
      #splash .bar i::after { width: 35%; }
      #splash .lv { --c: #E0A458; animation: splash-swell 5.7s ease-in-out infinite alternate; }
      #splash .ld { --c: #D9605F; animation: splash-hit .5s ease-out infinite; }
      #splash .lb { --c: #4FC3B0; animation: splash-hit 1s ease-out infinite; }
      #splash .lo { --c: #8E85E0; animation: splash-hit .5s ease-out -.25s infinite; }
      #splash .lv::before { animation-duration: 5.3s; animation-delay: -.5s; } #splash .lv::after { animation-duration: 6.1s; animation-delay: -4s; }
      #splash .ld::before { animation-duration: 3.7s; animation-delay: -2.9s; } #splash .ld::after { animation-duration: 4.9s; animation-delay: -1s; }
      #splash .lb::before { animation-duration: 4.1s; animation-delay: -3.3s; } #splash .lb::after { animation-duration: 5.7s; animation-delay: -2.2s; }
      #splash .lo::before { animation-duration: 3.3s; animation-delay: -1.6s; } #splash .lo::after { animation-duration: 4.5s; animation-delay: -3.7s; }
      @keyframes splash-drift { from { left: -25%; } to { left: 75%; } }
      @keyframes splash-hit { 0% { opacity: .8; } 60%, 100% { opacity: .2; } }
      @keyframes splash-swell { from { opacity: .3; } to { opacity: .7; } }
      #splash .fail { max-width: min(640px, 90vw); display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
      #splash .fail b { color: #FF3B30; font-weight: 600; }
      #splash .fail pre { margin: 0; padding: 12px; max-width: 100%; overflow: auto; white-space: pre-wrap; word-break: break-word;
        background: #131519; border: 1px solid #2A2F37; border-radius: 8px; color: #EDEFF2; font: 13px/18px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      #splash .fail button { height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #3A414B; background: #1A1D22; color: #EDEFF2; font: inherit; cursor: pointer; }
      @media (prefers-reduced-motion: reduce) { #splash .bar i, #splash .bar i::before, #splash .bar i::after { animation: none; opacity: .7; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash" role="status">
        <span class="bar" aria-hidden="true"><i class="lv"></i><i class="ld"></i><i class="lb"></i><i class="lo"></i></span>
        <span>Starting Stemcraft…</span>
      </div>
    </div>
    <noscript>Stemcraft needs JavaScript.</noscript>
    <!-- N-08: if the bundle fails to load, or throws before React mounts, the splash must say
         why instead of pulsing for ever. A script that fails to load fires `error` on the
         script element, which does not bubble, hence the capture listener. -->
    <script>
      (function () {
        var TIMEOUT_MS = 15000;
        var done = false;
        function splash() { return document.getElementById('splash'); }
        function fail(title, detail) {
          var el = splash();
          if (done || !el) return;
          done = true;
          el.setAttribute('role', 'alert');
          el.textContent = '';
          var box = document.createElement('div');
          box.className = 'fail';
          var head = document.createElement('b');
          head.textContent = title;
          var trace = document.createElement('pre');
          trace.textContent = detail;
          var retry = document.createElement('button');
          retry.type = 'button';
          retry.textContent = 'Reload';
          retry.addEventListener('click', function () { location.reload(); });
          box.appendChild(head);
          box.appendChild(trace);
          box.appendChild(retry);
          el.appendChild(box);
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t !== window && t.tagName === 'SCRIPT') {
            fail('Stemcraft could not load', 'The script ' + (t.src || '(inline)') + ' failed to load.');
          } else {
            fail('Stemcraft failed to start', e.error && e.error.stack ? e.error.stack : String(e.message));
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          fail('Stemcraft failed to start', r && r.stack ? r.stack : String(r));
        });
        setTimeout(function () {
          if (done || !splash()) return;
          var script = document.querySelector('script[type="module"][src]');
          var src = script ? script.getAttribute('src') : '';
          var title = 'Stemcraft is taking too long to start';
          if (!src) return fail(title, 'No application script is referenced by this page.');
          fetch(src, { cache: 'no-store' }).then(function (r) {
            fail(title, r.ok
              ? src + ' answered HTTP ' + r.status + ' but the app has not started. The browser console has the reason.'
              : src + ' answered HTTP ' + r.status + ' ' + r.statusText);
          }, function (err) {
            fail(title, src + ': ' + (err && err.message ? err.message : String(err)));
          });
        }, TIMEOUT_MS);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
